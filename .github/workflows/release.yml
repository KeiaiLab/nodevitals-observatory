# 릴리스 — main 착지 시 Chart.yaml 의 appVersion 을 진실로 삼아 이미지를 발행한다.
# 멱등이라 이미 발행된 태그는 건너뛴다: 문서-only 커밋이나 재실행에 안전하다.
#
# 버전이 사는 곳은 Chart.yaml 하나다. 소스에 적어 두면 bump 를 잊는 순간
# 이미지가 자기 버전을 틀리게 신고하고, 그게 배포 검증의 유일한 근거다.
name: release

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "Dockerfile"
      - "deploy/chart/Chart.yaml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMG: ghcr.io/keiailab/nodevitals-observatory

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Chart.yaml 의 appVersion 을 읽는다 (SSOT)
        id: ver
        run: |
          APP=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' deploy/chart/Chart.yaml)
          case "$APP" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::appVersion 이 semver 가 아니다: $APP"; exit 1 ;;
          esac
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "appVersion=$APP"

      - name: 이미 발행됐는지 본다
        id: img
        run: |
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:keiailab/nodevitals-observatory:pull&service=ghcr.io" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/keiailab/nodevitals-observatory/manifests/${{ steps.ver.outputs.app }}")
          if [ "$CODE" = "200" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          echo "manifest HTTP $CODE"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.img.outputs.exists == 'false'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.img.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 · 발행
        if: steps.img.outputs.exists == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMG }}:${{ steps.ver.outputs.app }}
          build-args: |
            VERSION=${{ steps.ver.outputs.app }}
