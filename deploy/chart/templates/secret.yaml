{{- /* 평문 values 커밋 금지 — adminPassword 는 --set/외부 주입 또는 미설정.
     미설정 시: 기존 Secret 이 있으면 lookup 으로 보존(업그레이드 시 회전 방지),
     없으면 randAlphaNum 24 생성. helm template/lint(오프라인) 는 lookup 이 빈
     dict 를 반환해 rand 경로로 렌더 — lint 클린 유지. */ -}}
{{- $name := printf "%s-auth" (include "nodevitals-observatory.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pass := .Values.auth.adminPassword -}}
{{- if not $pass }}{{- if $existing }}{{- $pass = index $existing.data "admin-password" | b64dec -}}
{{- else }}{{- $pass = randAlphaNum 24 -}}{{- end }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nodevitals-observatory.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.auth.adminUser | quote }}
  admin-password: {{ $pass | quote }}
