image:
  repository: ghcr.io/keiailab/nodevitals-observatory
  tag: ""                    # 기본 Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-keiailab-pull  # platform-system 기존 secret (확정 사실)

scrape:
  mode: kubernetes            # kubernetes | static
  namespace: platform-system
  selector: app.kubernetes.io/name=nodevitals
  port: 9847
  interval: 15s
  staticTargets: ""           # mode=static 일 때 콤마 URL 목록

demo:
  enabled: false              # true = GPU 플릿 데모 모드 — 스크레이프 비활성, 합성 플릿(기본 7,000 GPU) emit
  seed: 42                    # 결정론 시드 — 같은 값 = 같은 플릿·uuid
  fleet: ""                   # "" = 엔진 기본(4-CSP). "id:표시명:GPU수,..." 로 재정의
  timeScale: 1                # 시나리오 배속(리허설용) — emit 주기(15s/60s)는 불변
  backfillAgg: ""             # 집계 백필 창 (예 "24h", "" = 기본)
  backfillGpu: ""             # per-GPU 백필 창 (예 "1h", "" = 기본)

service:
  type: ClusterIP
  port: 9090                  # API 포트

persistence:
  enabled: false               # false = emptyDir (기본)
  size: 10Gi
  storageClassName: ""         # "" = 클러스터 기본

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}

serviceAccount:
  create: true
  name: ""                     # "" = fullname

rbac:
  create: true

auth:
  adminUser: admin
  adminPassword: ""   # 평문 커밋 금지 — --set/외부 주입. "" = 차트 랜덤 생성(기존 Secret lookup 보존)

ingress:
  enabled: true       # 배포 목적 기본 true (m4-constraints) — NetBird-gated 내부 도메인 전제(공개 DNS 미등록)
  host: observatory.keiailab.dev
  gatewayName: keiailab-edge
  gatewayNamespace: platform-system
  sectionName: https-dev
