image:
  repository: ghcr.io/keiailab/nodevitals-observatory
  tag: ""                    # 기본 Chart.appVersion
  pullPolicy: IfNotPresent

# ghcr.io 의 이 패키지는 public 이라 imagePullSecrets 가 필요 없다.
imagePullSecrets: []

scrape:
  mode: kubernetes            # kubernetes | static
  namespace: platform-system
  selector: app.kubernetes.io/name=nodevitals
  port: 9847
  interval: 15s
  staticTargets: ""           # mode=static 일 때 콤마 URL 목록


# 알림 — 룰 디렉터리를 지정하면 평가가 돌고, webhook URL 이 있으면 발송한다.
# 룰이 없으면 조회 전용으로 도는 것도 유효한 구성이다.
alerting:
  # 룰 파일(Prometheus 형식 YAML)을 담은 ConfigMap 이름. "" 이면 알림 비활성.
  rulesConfigMap: ""
  # 발송 대상. 비우면 평가만 하고 보내지 않는다(경고 로그를 남긴다).
  webhookURL: ""

service:
  type: ClusterIP
  port: 9090                  # API 포트

persistence:
  enabled: false               # false = emptyDir (기본)
  size: 10Gi
  storageClassName: ""         # "" = 클러스터 기본

# 메모리 상한은 *정상 사용량* 이 아니라 *압축 순간 피크* 로 잡는다. tsdb Compact 는
# head 전체를 슬라이스로 꺼내 원본 블록을 쓰고, 다시 롤업 사본을 만들어 한 번 더
# 쓴다 — 그 순간 head·원본 사본·롤업 사본이 동시에 상주해 정상값의 몇 배가 된다.
# 프로토타입 실측(합성 7,000 GPU): 정상 272MiB / 압축 피크 1.39GiB(약 5배).
# 낮추려면 상한이 아니라 Compact 의 전량 사본을 먼저 없애야 한다(스트리밍 압축).
resources:
  requests: {cpu: 100m, memory: 768Mi}
  limits: {cpu: "1", memory: 3Gi}

serviceAccount:
  create: true
  name: ""                     # "" = fullname

rbac:
  create: true

auth:
  adminUser: admin
  adminPassword: ""   # 평문 커밋 금지 — --set/외부 주입. "" = 차트 랜덤 생성(기존 Secret lookup 보존)

ingress:
  enabled: true       # 배포 목적 기본 true (m4-constraints) — NetBird-gated 내부 도메인 전제(공개 DNS 미등록)
  host: observatory.keiailab.dev
  gatewayName: keiailab-edge
  gatewayNamespace: platform-system
  sectionName: https-dev
